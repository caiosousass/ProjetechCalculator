<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projetech Admin">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="icons/icon-admin-192.png">
<link rel="stylesheet" href="auth.css">
<title>Administrador · Projetech Calculator</title>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo"><img src="logo.png" alt="Projetech Eventos"></div>
    <h1 class="login-title">Área do administrador</h1>
    <p class="login-sub">Acesso restrito à Projetech</p>

    <div class="card">
      <form id="form" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" inputmode="email" autocomplete="username" placeholder="voce@empresa.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" id="go" type="submit" style="margin-top:16px">Entrar</button>
      </form>
      <div class="msg" id="msg"></div>
      <div class="hint">
        <a href="#" id="forgot" style="color:var(--acc2);font-weight:700">Esqueci minha senha</a>
        &nbsp;·&nbsp;
        <a href="index.html" style="color:var(--acc2)">Voltar para a calculadora</a>
      </div>
    </div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var msg = $('msg'), form = $('form'), go = $('go');
  function show(t,k){ msg.className='msg '+(k||'err'); msg.textContent=t; }

  if(!PTAuth.configured){
    form.style.display='none';
    show('O acesso ainda não foi configurado. Preencha supabase-config.js com a URL e a chave anon do projeto.','warn');
    return;
  }

  // Já logado como admin? Vai direto pro painel.
  PTAuth.session().then(function(s){ if(s) location.replace('admin.html'); });

  var mode = 'login';   // 'login' | 'reset'

  $('forgot').addEventListener('click', function(e){
    e.preventDefault();
    mode = (mode === 'login') ? 'reset' : 'login';
    msg.className = 'msg';
    var reset = mode === 'reset';
    $('senha').closest('.field').style.display = reset ? 'none' : '';
    $('senha').required = !reset;
    go.textContent = reset ? 'Enviar link de redefinição' : 'Entrar';
    document.querySelector('.login-title').textContent = reset ? 'Redefinir senha' : 'Área do administrador';
    document.querySelector('.login-sub').textContent = reset
      ? 'Enviamos um link para o seu e-mail' : 'Acesso restrito à Projetech';
    $('forgot').textContent = reset ? 'Voltar para o login' : 'Esqueci minha senha';
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    msg.className='msg';
    var email = $('email').value.trim();

    if(mode === 'reset'){
      if(!email){ show('Informe seu e-mail.','err'); return; }
      go.disabled=true; go.textContent='Enviando…';
      try{
        await PTAuth.sendReset(email);
        show('Se este e-mail tiver conta, enviamos um link para redefinir a senha. Confira sua caixa de entrada (e o spam).','ok');
      }catch(err){
        var te=(err&&err.message)||'Não foi possível enviar.';
        if(/rate|too many/i.test(te)) te='Muitas tentativas. Espere alguns minutos e tente de novo.';
        else if(/redirect|not allowed|url/i.test(te)) te='Falta liberar o endereço de retorno no Supabase (Authentication → URL Configuration).';
        else if(/failed to fetch|network/i.test(te)) te='Sem conexão com o servidor. Verifique a internet e tente de novo.';
        show(te,'err');
      }
      go.disabled=false; go.textContent='Enviar link de redefinição';
      return;
    }

    go.disabled=true; go.textContent='Entrando…';
    try{
      await PTAuth.signIn(email, $('senha').value);
      location.replace('admin.html');
    }catch(err){
      var t=(err&&err.message)||'Não foi possível entrar.';
      if(/invalid login credentials/i.test(t)) t='E-mail ou senha incorretos.';
      else if(/não é de administrador/i.test(t)) { /* mantém a mensagem do auth.js */ }
      else if(/email not confirmed/i.test(t)) t='E-mail ainda não confirmado.';
      else if(/failed to fetch|network/i.test(t)) t='Sem conexão com o servidor. Verifique a internet e tente de novo.';
      show(t,'err');
      go.disabled=false; go.textContent='Entrar';
    }
  });
})();
</script>
</body>
</html>
